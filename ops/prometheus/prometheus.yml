global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # RabbitMQ exposes this through its built-in rabbitmq_prometheus plugin in
  # local/core Docker modes. Managed RabbitMQ should be integrated through its
  # provider endpoint rather than another exporter.
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
