apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-gateway
  namespace: mreader-admin
  labels:
    mreader.io/plane: admin
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: admin-gateway
      part-of: mreader
      mreader.io/plane: admin
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: admin-gateway
        image: caddy:2.11.4-alpine
        ports:
        - name: http
          containerPort: 80
        env:
        - name: CADDY_SITE_ADDRESS
          value: :80
        resources:
          requests:
            memory: 96Mi
            cpu: 50m
          limits:
            memory: 256Mi
            cpu: 500m
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
        volumeMounts:
        - name: cfg
          mountPath: /etc/caddy/Caddyfile
          subPath: Caddyfile
          readOnly: true
      volumes:
      - name: cfg
        configMap:
          name: admin-gateway-config
      enableServiceLinks: false
---
apiVersion: v1
kind: Service
metadata:
  name: admin-gateway
  namespace: mreader-admin
  labels:
    mreader.io/plane: admin
spec:
  type: LoadBalancer
  selector:
    app: admin-gateway
    part-of: mreader
  ports:
  - name: http
    port: 8081
    targetPort: http
