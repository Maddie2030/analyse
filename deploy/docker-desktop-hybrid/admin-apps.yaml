apiVersion: apps/v1
kind: Deployment
metadata:
  name: scraper-service
  namespace: mreader-admin
  labels:
    mreader.io/plane: admin
spec:
  selector:
    matchLabels: &id001
      app: scraper-service
      part-of: mreader
      mreader.io/plane: admin
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: scraper-service
        image: mreader/scraper-service:v1.3.0-rc4.84
        imagePullPolicy: Never
        envFrom:
        - secretRef:
            name: mreader-env-scraper-service
        resources:
          requests:
            memory: 192Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: '1'
        env:
        - name: SCRAPER_API_DB_MAX_CONNECTIONS
          value: '2'
        - name: SCRAPER_STAGING_BACKEND
          value: kubernetes-pvc
        - name: CATALOG_INTERNAL_URL
          value: http://catalog-admin:8080
        - name: READER_INTERNAL_URL
          value: http://reader-go.mreader-user.svc.cluster.local:8080
        - name: IMAGE_INTERNAL_URL
          value: http://image-service:8000
        ports:
        - name: http
          containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        volumeMounts:
        - name: scraper-staging
          mountPath: /var/lib/mreader/scraper-staging
      terminationGracePeriodSeconds: 30
      volumes:
      - name: scraper-staging
        persistentVolumeClaim:
          claimName: scraper-staging
      enableServiceLinks: false
  replicas: 1
---
apiVersion: v1
kind: Service
metadata:
  name: scraper-service
  namespace: mreader-admin
  labels:
    mreader.io/plane: admin
spec:
  selector:
    app: scraper-service
    part-of: mreader
  ports:
  - name: http
    port: 8000
    targetPort: http
