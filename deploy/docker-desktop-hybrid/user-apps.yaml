apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: mreader-user
  labels:
    mreader.io/plane: user
spec:
  selector:
    matchLabels: &id001
      app: auth-service
      part-of: mreader
      mreader.io/plane: user
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: auth-service
        image: mreader/auth-service:v1.3.0-rc4.84
        imagePullPolicy: Never
        envFrom:
        - secretRef:
            name: mreader-env-auth-service
        resources:
          requests:
            memory: 160Mi
            cpu: 100m
          limits:
            memory: 384Mi
            cpu: 500m
        env:
        - name: DB_POOL_SIZE
          value: '2'
        - name: DB_MAX_OVERFLOW
          value: '1'
        - name: COOKIE_SECURE
          valueFrom:
            secretKeyRef:
              name: mreader-public-edge
              key: COOKIE_SECURE
        ports:
        - name: http
          containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
      terminationGracePeriodSeconds: 30
      enableServiceLinks: false
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: mreader-user
  labels:
    mreader.io/plane: user
spec:
  selector:
    app: auth-service
    part-of: mreader
  ports:
  - name: http
    port: 8000
    targetPort: http
---
