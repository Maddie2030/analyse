apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-gateway
  namespace: mreader-user
  labels:
    mreader.io/plane: user
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: user-gateway
      part-of: mreader
      mreader.io/plane: user
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: user-gateway
        image: caddy:2.11.4-alpine
        ports:
        - name: http
          containerPort: 80
        env:
        - name: CADDY_SITE_ADDRESS
          value: :80
        resources:
          requests:
            memory: 96Mi
            cpu: 50m
          limits:
            memory: 256Mi
            cpu: 500m
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
        volumeMounts:
        - name: cfg
          mountPath: /etc/caddy/Caddyfile
          subPath: Caddyfile
          readOnly: true
      volumes:
      - name: cfg
        configMap:
          name: user-gateway-config
      enableServiceLinks: false
---
apiVersion: v1
kind: Service
metadata:
  name: user-gateway
  namespace: mreader-user
  labels:
    mreader.io/plane: user
spec:
  type: LoadBalancer
  selector:
    app: user-gateway
    part-of: mreader
  ports:
  - name: http
    port: 8080
    targetPort: http
