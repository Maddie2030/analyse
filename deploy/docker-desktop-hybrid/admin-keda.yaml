# The event outbox relay is pure background work. PostgreSQL itself wakes it
# only while an event is due or currently claimed, so it consumes no pod
# resources when the outbox is empty or waiting for a future retry time.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: outbox-relay
  namespace: mreader-admin
  labels:
    mreader.io/plane: admin
spec:
  scaleTargetRef:
    name: outbox-relay
    envSourceContainerName: outbox-relay
  pollingInterval: 5
  cooldownPeriod: 20
  minReplicaCount: 0
  maxReplicaCount: 1
  fallback:
    failureThreshold: 3
    replicas: 1
  triggers:
  - type: postgresql
    metadata:
      connectionFromEnv: KEDA_POSTGRES_URL
      targetQueryValue: '1'
      activationTargetQueryValue: '0'
      query: >-
        SELECT CASE WHEN EXISTS (
          SELECT 1 FROM event_outbox
          WHERE published_at IS NULL
            AND (locked_at IS NOT NULL OR available_at <= NOW())
        ) THEN 1 ELSE 0 END
---
# Lifecycle cleanup is also a durable DB-backed queue. Future retry rows do not
# keep a pod idle; KEDA wakes the worker when next_attempt_at becomes due.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: lifecycle-worker
  namespace: mreader-admin
  labels:
    mreader.io/plane: admin
spec:
  scaleTargetRef:
    name: lifecycle-worker
    envSourceContainerName: lifecycle-worker
  pollingInterval: 15
  cooldownPeriod: 30
  minReplicaCount: 0
  maxReplicaCount: 1
  fallback:
    failureThreshold: 3
    replicas: 1
  triggers:
  - type: postgresql
    metadata:
      connectionFromEnv: KEDA_POSTGRES_URL
      targetQueryValue: '1'
      activationTargetQueryValue: '0'
      query: >-
        SELECT CASE WHEN EXISTS (
          SELECT 1 FROM lifecycle_cleanup_jobs
          WHERE status='processing'
             OR (status IN ('queued','retry') AND next_attempt_at <= NOW())
        ) THEN 1 ELSE 0 END
